<body>
<div style="font-family:'TASA Orbiter',system-ui,sans-serif;color:#EDEBE5;background:#080B08;min-height:100%;position:relative;overflow-x:clip">

  <!-- Band: the Settings tab's colours -->
  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:540px;background-image:radial-gradient(rgba(8,11,8,.5) 1px,transparent 1.4px),linear-gradient(103deg,#FBD509 0%,#52CD86 50%,#3E98FF 100%);background-size:6px 6px,100% 100%;-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.7) 40%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.7) 40%,transparent 100%);opacity:.85"></div>

  <header class="hdr">
    <div class="hdr-in">
      <a class="brand" href="/" aria-label="Amaviro home"><img class="brand-mark" src="/assets/logo-128.png" alt="" width="32" height="32"><span class="brand-word">Amaviro</span></a>
      <nav class="links" aria-label="Main">
        <a href="/features/">Features</a>
        <a href="/plus/">Plus</a>
        <a href="/support/">Support</a>
        <a href="#beta">Beta</a>
      </nav>
      <a class="btn btn-primary cta" href="/#download">Get Amaviro</a>
    </div>
  </header>
  <section style="position:relative;max-width:1200px;margin:0 auto;padding:96px 24px 140px;display:flex;flex-direction:column;gap:18px">
    <span class="lbl" style="color:#EDEBE5">Not found</span>
    <h1 style="margin:0;font-size:56px;line-height:1.05;letter-spacing:-.025em;font-weight:700">This page isn't here.</h1>
    <p style="margin:0;font-size:19px;line-height:1.5;max-width:560px">It may have moved. Try the home page, or Support.</p>
    <div style="display:flex;flex-wrap:wrap;gap:12px;padding-top:8px"><a class="btn btn-primary" href="/">Home</a><a class="btn btn-outline" href="/support/">Support</a></div>
  </section>

  <footer class="nav" style="border-top:1px solid #2C322D">
    <div style="max-width:1200px;margin:0 auto;padding:32px 24px;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center">
      <span style="font-size:13px;color:#979D97">© 2026 Ataur Rahman · Amaviro doesn't include any channels or streams.</span>
      <span style="display:flex;flex-wrap:wrap;gap:24px"><a href="/features/">Features</a><a href="/privacy/">Privacy</a><a href="/privacy/#terms">Terms</a><a href="https://discord.gg/vtu5hDkdbZ">Discord</a></span>
    </div>
  </footer>
</div>
<script>
// Support and Beta share this page: the header marks Beta while you're at the beta section (from the Beta link, or
// scrolled there), and Support elsewhere, so only one is ever highlighted.
(() => {
  const links = [...document.querySelectorAll('.links a')];
  const support = links.find(a => a.getAttribute('href') === '/support/');
  const beta = links.find(a => a.getAttribute('href') === '#beta' || a.getAttribute('href') === '/support/#beta');
  const section = document.getElementById('beta');
  if (!support || !beta || !section) return;
  function mark(atBeta) {
    for (const [a, on] of [[support, !atBeta], [beta, atBeta]]) {
      a.classList.toggle('on', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
  }
  const io = new IntersectionObserver(es => { for (const e of es) mark(e.isIntersecting); }, { rootMargin: '-45% 0px -45% 0px' });
  io.observe(section);
  mark(location.hash === '#beta');
})();
</script>
